# Diagnostic only. Determines whether Cloudflare blocks BGG logins from GitHub
# runners always or only sometimes, which decides whether an automatic retry can
# fix the daily update job. Uses deliberately invalid credentials - no secrets.
name: Probe BGG login reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - run: pip install requests selenium

      - name: Probe
        run: |
          python - <<'PY'
          import time, requests
          from datetime import datetime

          H = {'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 '
                             '(KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
               'Accept': 'application/json, text/plain, */*',
               'Content-Type': 'application/json',
               'Origin': 'https://boardgamegeek.com',
               'Referer': 'https://boardgamegeek.com/login'}
          CREDS = {'credentials': {'username': 'zzz_probe_not_a_real_user', 'password': 'x'}}

          def log(m): print(f'[{datetime.now():%H:%M:%S}] {m}', flush=True)

          ip = requests.get('https://api.ipify.org', timeout=20).text
          log(f'runner public IP: {ip}')

          log('--- baseline GET /login ---')
          r = requests.get('https://boardgamegeek.com/login', headers={'User-Agent': H['User-Agent']}, timeout=30)
          log(f'  HTTP {r.status_code}')

          log('--- 5 x POST /login/api/v1 via requests, 20s apart ---')
          results = []
          for i in range(1, 6):
              try:
                  s = requests.Session(); s.headers.update(H)
                  r = s.post('https://boardgamegeek.com/login/api/v1', json=CREDS, timeout=30)
                  results.append(r.status_code)
                  log(f'  {i}: HTTP {r.status_code}  cf-mitigated={r.headers.get("cf-mitigated")}  {r.text[:60]!r}')
              except Exception as e:
                  results.append('ERR'); log(f'  {i}: ERR {e}')
              if i < 5: time.sleep(20)

          log('--- 2 x POST from inside Chrome ---')
          from selenium import webdriver
          o = webdriver.ChromeOptions()
          for a in ('--headless=new', '--no-sandbox', '--disable-dev-shm-usage'): o.add_argument(a)
          d = webdriver.Chrome(options=o)
          JS = """
          const done = arguments[arguments.length - 1];
          fetch('/login/api/v1', {method:'POST', credentials:'include',
              headers:{'Content-Type':'application/json'},
              body: JSON.stringify({credentials:{username:'zzz_probe_not_a_real_user',password:'x'}})
          }).then(r => r.text().then(t => done({status:r.status, body:t.slice(0,120)})))
            .catch(e => done({status:-1, body:String(e)}));
          """
          try:
              d.get('https://boardgamegeek.com/login')
              d.set_script_timeout(60)
              log(f'  page title: {d.title!r}')
              for i in (1, 2):
                  res = d.execute_async_script(JS)
                  results.append(res.get('status'))
                  log(f'  browser {i}: HTTP {res.get("status")}  {res.get("body")!r}')
                  time.sleep(20)
          finally:
              d.quit()

          blocked = sum(1 for c in results if c == 403)
          log(f'=== VERDICT: {blocked}/{len(results)} blocked (403), '
              f'{sum(1 for c in results if c == 400)}/{len(results)} reached BGG (400) ===')
          PY
